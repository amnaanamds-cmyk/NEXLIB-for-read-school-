name: Build Windows EXE

on:
  push:
    branches: [ main, claude/project-folder-overview-kldv6c ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build NexLib.exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NexLib --icon assets\nexlib.ico main.py

      - name: Compute checksum
        id: checksum
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\NexLib.exe).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          $size = [math]::Round((Get-Item dist\NexLib.exe).Length / 1MB, 1)
          "size=$size MB" >> $env:GITHUB_OUTPUT
          "$hash  NexLib.exe" | Out-File -FilePath dist\NexLib.exe.sha256.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexLib-Windows-exe
          path: |
            dist/NexLib.exe
            dist/NexLib.exe.sha256.txt

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cat > release-notes.md << EOF
          ## NexLib ${{ github.ref_name }} — School Library Management System

          A single-window, fully offline desktop app for managing a school or
          college library: books, members, issue/return, OPAC, inventory,
          inter-library loans, acquisitions, serials, and reports. No cloud
          account, no internet connection required — every school sets up its
          own profile on first launch.

          ### Download
          Grab **NexLib.exe** below and double-click to run it — no Python or
          installer needed. Windows SmartScreen may warn that the app is
          unrecognized (it isn't code-signed); choose **More info → Run anyway**.

          ### Verify the download (optional)
          \`\`\`
          ${{ steps.checksum.outputs.sha256 }}  NexLib.exe
          \`\`\`
          Size: ${{ steps.checksum.outputs.size }}

          ### First run
          NexLib opens a one-time setup wizard to create your school's profile
          and first administrator account, then goes straight to login on every
          launch after that.
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NexLib.exe
            dist/NexLib.exe.sha256.txt
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
